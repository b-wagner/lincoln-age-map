&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;

    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);

  const setWidgetState = async (next) =&gt; {

      isArray(parsedState)

      privateContent: null,

      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);

    }
    const id = ++nextStateRequestId;

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              setViewportHeight(data.viewportHeight, data.viewportOffset);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

&lt;div class=&quot;panel-top&quot;&gt;&lt;h2 id=&quot;panel-title&quot;&gt;Explore &amp; filters&lt;/h2&gt;&lt;button class=&quot;btn close-panel&quot; type=&quot;button&quot;&gt;Done&lt;/button&gt;&lt;/div&gt;
&lt;section class=&quot;panel-section&quot;&gt;
&lt;label for=&quot;place-search&quot; class=&quot;field-label&quot;&gt;Find a place&lt;/label&gt;
&lt;input id=&quot;place-search&quot; class=&quot;form-control&quot; type=&quot;search&quot; placeholder=&quot;Historic building or street&quot; autocomplete=&quot;off&quot; aria-describedby=&quot;place-status&quot; aria-controls=&quot;place-results&quot;&gt;
&lt;p class=&quot;search-status&quot; id=&quot;place-status&quot; role=&quot;status&quot;&gt;Search historic buildings or named streets.&lt;/p&gt;
&lt;ul class=&quot;place-results&quot; id=&quot;place-results&quot; aria-label=&quot;Places&quot;&gt;&lt;/ul&gt;
&lt;details&gt;&lt;summary&gt;Browse all historic buildings&lt;/summary&gt;&lt;label for=&quot;historic-picker&quot; class=&quot;field-label&quot;&gt;Historic building&lt;/label&gt;&lt;select id=&quot;historic-picker&quot; class=&quot;form-select historic-picker&quot;&gt;&lt;option value=&quot;&quot;&gt;Choose a historic building…&lt;/option&gt;&lt;/select&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;details class=&quot;panel-section layer-settings&quot;&gt;
&lt;summary&gt;&lt;span id=&quot;layers-title&quot;&gt;Map layers&lt;/span&gt;&lt;/summary&gt;
&lt;label class=&quot;layer-check&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lincoln-area-toggle&quot; checked&gt;&lt;span&gt;Area age&lt;small&gt;Median residential decade within 600 m&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;
&lt;label class=&quot;layer-check&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lincoln-historic-toggle&quot; checked&gt;&lt;span&gt;Historic buildings&lt;small&gt;Grouped nearby records; select to explore&lt;/small&gt;&lt;/span&gt;&lt;/label&gt;
&lt;label for=&quot;lincoln-detail-mode&quot; class=&quot;grid-label&quot;&gt;Residential age grid · 120 m squares&lt;/label&gt;
&lt;select id=&quot;lincoln-detail-mode&quot; class=&quot;form-select&quot;&gt;&lt;option value=&quot;auto&quot;&gt;Automatic · visible from 4× zoom&lt;/option&gt;&lt;option value=&quot;on&quot;&gt;Always visible&lt;/option&gt;&lt;option value=&quot;off&quot;&gt;Hidden&lt;/option&gt;&lt;/select&gt;
&lt;/details&gt;
&lt;section class=&quot;panel-section&quot; aria-labelledby=&quot;decades-title&quot;&gt;
&lt;div class=&quot;legend-heading&quot;&gt;&lt;h2 id=&quot;decades-title&quot;&gt;Construction decade&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;btn clear-decade&quot;&gt;Show all&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;muted&quot; style=&quot;font-size:12px&quot;&gt;Select to highlight matching area medians, most-common grid decades, and historic dates.&lt;/p&gt;
&lt;div class=&quot;legend&quot; role=&quot;group&quot; aria-label=&quot;Highlight construction decade&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;decade-counts muted&quot; style=&quot;font-size:12px&quot;&gt;&lt;/p&gt;
&lt;/section&gt;
&lt;details class=&quot;methodology&quot;&gt;&lt;summary&gt;Sources &amp; methodology&lt;/summary&gt;
&lt;p&gt;Snapshot: October 20, 2026. Colors summarize dated residential records, not every building or individual parcel boundaries.&lt;/p&gt;
&lt;p&gt;Area age is the median decade within approximately 600 m, using at least 20 records. Each 120 m grid square shows its most common decade. Historic markers are separate records and may overlap residential records; multi-phase buildings use their earliest date for color.&lt;/p&gt;
&lt;p&gt;Blank areas may contain commercial, institutional, or other properties without usable residential dates. The shapes are not official neighborhood boundaries. Assessor dates may be approximate.&lt;/p&gt;
&lt;p&gt;Public GIS sources: &lt;a href=&quot;https://gis.lincoln.ne.gov/public/rest/services/Assessor/TaxParcels/MapServer/0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Assessor parcels&lt;/a&gt;, &lt;a href=&quot;https://gis.lincoln.ne.gov/public/rest/services/Planning/HistoricPreservation/MapServer/0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;historic preservation&lt;/a&gt;, &lt;a href=&quot;https://gis.lincoln.ne.gov/public/rest/services/Planning/Streets/MapServer/0&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;streets&lt;/a&gt;, and &lt;a href=&quot;https://gis.lincoln.ne.gov/public/rest/services/CityCounty/CityLimits/MapServer/4&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;city limits&lt;/a&gt;.&lt;/p&gt;
&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;How to use the map&lt;/summary&gt;&lt;p&gt;Click or tap an area for details. Select a group of historic buildings to zoom in. Use Find a place to search buildings or streets; exact residential addresses are not included.&lt;/p&gt;&lt;p&gt;On a touch screen, choose Move map to drag or pinch, then Done moving to resume page scrolling. On desktop, drag to pan and hold Ctrl or ⌘ while scrolling to zoom.&lt;/p&gt;&lt;p id=&quot;keyboard-help&quot;&gt;Keyboard: focus the map, use arrows to pan, + / − to zoom, Home for citywide, and Enter to inspect the crosshair. Escape exits map movement.&lt;/p&gt;&lt;/details&gt;
&lt;/dialog&gt;
&lt;section class=&quot;map-main&quot; aria-label=&quot;Building age explorer&quot;&gt;
&lt;div class=&quot;map-toolbar&quot; role=&quot;group&quot; aria-label=&quot;Map navigation&quot;&gt;
&lt;div class=&quot;nav-group&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn zoom-btn&quot; data-zoom=&quot;in&quot; aria-label=&quot;Zoom in&quot;&gt;+&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn zoom-btn&quot; data-zoom=&quot;out&quot; aria-label=&quot;Zoom out&quot;&gt;−&lt;/button&gt;&lt;span class=&quot;zoom-level&quot;&gt;1×&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-view=&quot;city&quot;&gt;Citywide&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-view=&quot;downtown&quot;&gt;Downtown&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;nav-group secondary-tools&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn open-panel&quot;&gt;Search &amp; filters&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn mobile-only touch-mode&quot; aria-pressed=&quot;false&quot;&gt;Move map&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn expand-map&quot; aria-pressed=&quot;false&quot;&gt;Expand map&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;map-stage&quot; tabindex=&quot;0&quot; role=&quot;region&quot; aria-label=&quot;Interactive map of Lincoln building ages&quot; aria-describedby=&quot;keyboard-help&quot; data-touch-explore=&quot;false&quot;&gt;
&lt;svg role=&quot;group&quot; aria-label=&quot;Residential construction decades and historic markers in Lincoln.&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;map-hint&quot;&gt;Select an area to learn more · Ctrl / ⌘ + scroll to zoom&lt;/div&gt;
&lt;div class=&quot;map-tip&quot; role=&quot;tooltip&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;map-loading&quot; role=&quot;status&quot;&gt;&lt;strong class=&quot;loading-title&quot;&gt;Preparing Lincoln’s building ages…&lt;/strong&gt;&lt;p class=&quot;loading-description&quot;&gt;Loading the bundled map. No live data connection is needed.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;btn retry-map&quot; hidden&gt;Retry map&lt;/button&gt;
&lt;noscript&gt;&lt;p&gt;The interactive map needs JavaScript. It summarizes 87,356 dated residential parcels into area medians and 120 m grids, with 170 separate historic records. Enable JavaScript to explore the map.&lt;/p&gt;&lt;/noscript&gt;
&lt;/div&gt;
&lt;/div&gt;

    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    measureViewport();
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
